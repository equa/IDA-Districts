[pytest]
# the simulation tests (folder simulation_tests) take long: only run when given explicitly
#   python -m pytest simulation_tests --sim-workers 4
testpaths = test
# pytest-qgis: run QGIS headless (offscreen)
qgis_gui_enabled = false
markers =
    e2e: full workflow against a PostgreSQL/PostGIS server (needs DB credentials)
    ida: needs an IDA Districts installation (simulation)
    incremental: skip the remaining steps of a class after the first failing step
    simulation: IDA Districts simulation of a test model (folder simulation_tests)
