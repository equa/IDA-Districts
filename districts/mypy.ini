[mypy]
# static type check of the plugin sources; run by test/test_static_mypy.py or by hand from the plugin folder:
#   python -m mypy
python_version = 3.12
# the plugin folder is the package 'districts' (imports: from districts.utility_functions... and from .x import y);
# utility_functions has no __init__.py (namespace package), so the package is searched from the folder above
mypy_path = $MYPY_CONFIG_FILE_DIR/..
packages = districts
namespace_packages = True
exclude = (?x)(
    (^|[\\/])\.qgis-settings[\\/]
    | (^|[\\/])\.pytest_cache[\\/]
    | (^|[\\/])help[\\/]
    | (^|[\\/])plugin_upload\.py$
    # custom widget of districts_dialog_base.ui: imported as top level module (from svg_label import SvgLabel),
    # as part of the package it would be found twice under different module names
    | (^|[\\/])svg_label\.py$
    # test of the plugin builder template, imports the dialog as top level module
    | (^|[\\/])test[\\/]test_districts_dialog\.py$
  )
# the function bodies of the plugin have no annotations: check them anyway
check_untyped_defs = True
# QGIS, PyQt and the scientific packages have no (usable) type information: their objects are Any
ignore_missing_imports = True
follow_imports = silent
# 'Need type annotation for ...' (x = [] / {}): only relevant for annotated code
disable_error_code = var-annotated
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
show_column_numbers = False
pretty = False
