<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <g id="customer">
      <rect x="0" y="0" width="72" height="72" rx="4" fill="#f2c12e"/>
      <rect x="14" y="26" width="20" height="38" fill="none" stroke="#7a5a00" stroke-width="3"/>
      <rect x="36" y="12" width="24" height="52" fill="none" stroke="#7a5a00" stroke-width="3"/>
      <g fill="#fff6d0">
        <rect x="19" y="32" width="4" height="5"/><rect x="26" y="32" width="4" height="5"/>
        <rect x="19" y="42" width="4" height="5"/><rect x="26" y="42" width="4" height="5"/>
        <rect x="41" y="18" width="5" height="5"/><rect x="50" y="18" width="5" height="5"/>
        <rect x="41" y="28" width="5" height="5"/><rect x="50" y="28" width="5" height="5"/>
        <rect x="41" y="38" width="5" height="5"/><rect x="50" y="38" width="5" height="5"/>
        <rect x="41" y="48" width="5" height="5"/><rect x="50" y="48" width="5" height="5"/>
      </g>
    </g>
  </defs>

  <!-- target line and equal differential pressure at the customers -->
  <g fill="#2f80ed">
    <rect x="186" y="62" width="32" height="92"/>
    <rect x="234" y="62" width="32" height="92"/>
    <rect x="282" y="62" width="32" height="92"/>
    <rect x="330" y="62" width="32" height="92"/>
  </g>
  <line x1="172" y1="156" x2="376" y2="156" stroke="#33414e" stroke-width="5"/>
  <line x1="168" y1="62" x2="388" y2="62" stroke="#2e9e44" stroke-width="5" stroke-dasharray="14 8"/>

  <!-- network: the branches near the plant are reduced most -->
  <g stroke="#111" fill="none" stroke-linecap="square">
    <line x1="64" y1="110" x2="64" y2="214" stroke-width="16"/>
    <line x1="64" y1="214" x2="160" y2="214" stroke-width="14"/>
    <line x1="160" y1="214" x2="256" y2="214" stroke-width="11"/>
    <line x1="256" y1="214" x2="350" y2="214" stroke-width="8"/>
    <line x1="64" y1="214" x2="64" y2="296" stroke-width="3"/>
    <line x1="160" y1="214" x2="160" y2="296" stroke-width="5"/>
    <line x1="256" y1="214" x2="256" y2="296" stroke-width="7"/>
    <line x1="350" y1="214" x2="350" y2="296" stroke-width="8"/>
  </g>

  <!-- energy plant -->
  <rect x="18" y="18" width="92" height="92" rx="5" fill="#2b3137"/>
  <g fill="#ffffff">
    <rect x="34" y="34" width="10" height="34"/>
    <rect x="30" y="62" width="40" height="32"/>
    <rect x="70" y="72" width="26" height="22"/>
    <circle cx="52" cy="30" r="7"/><circle cx="62" cy="26" r="6"/>
  </g>
  <g fill="#2b3137">
    <rect x="36" y="68" width="5" height="5"/><rect x="45" y="68" width="5" height="5"/><rect x="54" y="68" width="5" height="5"/>
    <rect x="36" y="78" width="5" height="5"/><rect x="45" y="78" width="5" height="5"/><rect x="54" y="78" width="5" height="5"/>
    <rect x="74" y="78" width="18" height="3"/>
  </g>

  <!-- customers -->
  <use xlink:href="#customer" x="28" y="296"/>
  <use xlink:href="#customer" x="124" y="296"/>
  <use xlink:href="#customer" x="220" y="296"/>
  <use xlink:href="#customer" x="314" y="296"/>
</svg>
